<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>当前时间</title>
    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString();
            document.getElementById("time").innerText = timeString;
        }
        setInterval(updateTime, 1000);
        window.onload = updateTime;
    </script>
</head>
<body>
<h1>当前时间</h1>
<p id="time"></p>
</body>
</html>
