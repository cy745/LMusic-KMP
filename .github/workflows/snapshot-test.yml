name: Snapshot Build

on:
  push:
    branches: [ "dev" ]
    # 仅在非文档/非工具路径变更时触发完整 CI
    paths-ignore:
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - '.gitignore'
      - '.yarnrc'
      - 'docs/**'
      - 'kotlin-js-store/**'
      - 'LICENSE'
      - 'midscene/**'
      - 'NOTICE'
      - 'release-page/**'
      - 'vercel.json'
      - '**/*.md'
      - '**/README.md'
  workflow_dispatch:
    inputs:
      skip_ios:
        description: '跳过 iOS 构建与 TestFlight 上传（push 时可在 commit message 写 [skip ios]）'
        type: boolean
        default: false
      testflight_source_run:
        description: '仅重试指定 Snapshot run ID 的 Beta 分发；留空则完整构建'
        type: string
        default: ''

concurrency:
  group: ${{ inputs.testflight_source_run && format('testflight-beta-{0}', inputs.testflight_source_run) || format('snapshot-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.testflight_source_run }}

env:
  SNAPSHOT_OWNER: cy745
  SNAPSHOT_REPO: LMusic-KMP
  SNAPSHOT_TAG: snapshot

jobs:
  # ──────────────────────────────────────────────
  # 构建各平台产物
  # ──────────────────────────────────────────────
  build-android:
    if: ${{ !inputs.testflight_source_run }}
    name: Android
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 配置 JDK 21 + Gradle 缓存
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 从 Secrets 创建 Keystore
      - name: Create Keystore from Secrets
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          echo "$KEYSTORE_JKS_BASE64" | base64 --decode > "${{ github.workspace }}/keystore.jks"
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 --decode > "${{ github.workspace }}/keystore.properties"

      # 构建 Release APK（Ubuntu 无 iOS 工具链，需禁用 iOS 目标）
      - run: chmod +x gradlew

      # 安装 UPX：Android 构建在 AGP strip 后用它压缩 libtag.so。
      # 固定 v5.2.0（与本地开发环境一致），不依赖 runner 镜像预装。
      - name: Install UPX
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz -o upx.tar.xz
          tar -xJf upx.tar.xz
          sudo mv upx-5.2.0-amd64_linux/upx /usr/local/bin/upx
          upx --version

      - name: Build Release APK
        run: ./gradlew androidApp:assembleRelease -Plalilu.disable.ios.targets=true

      # 上传 APK 产物
      - uses: actions/upload-artifact@v4
        with:
          name: LMusic-snapshot-android
          path: ${{ github.workspace }}/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # mapping.txt 必须与生成它的 APK 一一对应；提交 SHA 放在 Artifact 名称中，
      # 便于收到离线崩溃反馈后找到正确的映射文件。
      # mapping 仅保留在 CI Artifact 中，不进入面向用户的 Snapshot Release。
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: LMusic-android-mapping-${{ github.sha }}
          path: ${{ github.workspace }}/androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  build-windows:
    if: ${{ !inputs.testflight_source_run }}
    name: Windows
    runs-on: windows-latest
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 配置 JDK 21 + Gradle 缓存
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 构建 Release MSI（Windows 无 iOS 工具链，需禁用 iOS 目标）
      - name: Prepare Gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build Release MSI
        shell: bash
        run: ./gradlew composeApp:packageReleaseMsi -Plalilu.disable.ios.targets=true

      # 上传 MSI 产物
      - uses: actions/upload-artifact@v4
        with:
          name: LMusic-snapshot-windows
          if-no-files-found: error
          path: ${{ github.workspace }}\composeApp\build\compose\binaries\main-release\msi\*.msi

  build-macos:
    if: ${{ !inputs.testflight_source_run }}
    name: macOS
    runs-on: macos-26
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 配置 JDK 21 + Gradle 缓存
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # 导入 macOS Developer ID 签名证书（secrets 为空时跳过）
      - name: Import macOS Signing Certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build, Sign and Notarize DMG
        run: ./gradlew composeApp:notarizeReleaseDmg --no-configuration-cache
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 上传 DMG 产物
      - uses: actions/upload-artifact@v4
        with:
          name: LMusic-snapshot-macos
          if-no-files-found: error
          path: ${{ github.workspace }}/composeApp/build/compose/binaries/main-release/dmg/*.dmg

  build-linux:
    if: ${{ !inputs.testflight_source_run }}
    name: Linux
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 配置 JDK 21 + Gradle 缓存
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 构建 Release DEB（Linux 无 iOS 工具链，需禁用 iOS 目标）
      - run: chmod +x gradlew

      - name: Build Release DEB
        run: ./gradlew composeApp:packageReleaseDeb -Plalilu.disable.ios.targets=true

      # 上传 DEB 产物
      - uses: actions/upload-artifact@v4
        with:
          name: LMusic-snapshot-linux
          if-no-files-found: error
          path: ${{ github.workspace }}/composeApp/build/compose/binaries/main-release/deb/*.deb

  # ──────────────────────────────────────────────
  # iOS → TestFlight → Beta（Fastlane 自动上传、分组与送审）
  # ──────────────────────────────────────────────
  build-ios:
    name: iOS + TestFlight
    # 默认总是构建并上传 TestFlight；以下情况跳过：
    #   - push 时任一 commit message 包含 [skip ios]
    #   - 手动触发时勾选 skip_ios
    if: ${{ !inputs.testflight_source_run && !(github.event_name == 'workflow_dispatch' && inputs.skip_ios == 'true') && !(github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[skip ios]')) }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          working-directory: iosApp
          bundler-cache: true

      - name: Validate TestFlight automation
        working-directory: iosApp
        run: |
          bundle exec ruby fastlane/test/beta_test.rb
          bundle exec fastlane lanes
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'

      # 安装 xcbeautify（格式化 xcodebuild 输出，支持 GitHub Actions 注解）
      - name: Install xcbeautify
        run: brew install xcbeautify

      # 1. 导入 Distribution 签名证书到 keychain
      - uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.CERT_PASSWORD }}

      # 2. 下载 App Store 发布 Provisioning Profile
      - id: fetch-profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.lalilu.lmusic
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      # 2.5 预构建 Kotlin Framework（隔离链接内存）
      # K/N linkReleaseFrameworkIosArm64 在 Gradle daemon 内链接大 framework 需要 >8G 堆，
      # 直接放进 xcodebuild 会与 Xcode/clang 抢内存导致 java.lang.OutOfMemoryError
      #（07-30 / 08-18 三次同位置失败）。这里单独先跑，独占整机内存：
      #   - GRADLE_OPTS 只作用于本步骤的 daemon，不影响其他平台任务
      #   - 产物落 runner 磁盘缓存，xcodebuild 阶段 embedAndSign 时 link 任务 UP-TO-DATE 直接复用
      - name: Pre-build Kotlin Framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --console=plain
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx12G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC -Dfile.encoding=UTF-8

      # 3. 构建 + Archive（手动签名，使用导入的证书和已下载的 Profile）
      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LMusic.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.DEVELOPEMENT_TEAM }} \
            PROVISIONING_PROFILE_SPECIFIER="LMusic pub" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcbeautify --renderer github-actions
        shell: /bin/bash -o pipefail {0}

      # 4. 生成 ExportOptions.plist
      - name: Generate ExportOptions.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add method string app-store-connect" \
            -c "Add teamID string 89HDPPJNKB" \
            -c "Add signingStyle string manual" \
            -c "Add provisioningProfiles dict" \
            -c "Add provisioningProfiles:com.lalilu.lmusic string LMusic pub" \
            -c "Add uploadSymbols bool true" \
            ExportOptions.plist

      # 5. 导出 IPA
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LMusic.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            | xcbeautify --renderer github-actions
        shell: /bin/bash -o pipefail {0}

      # 6. 上传准确构建，关联现有 Beta 外部组并自动提交 Beta 审核。
      - name: Upload and distribute to TestFlight Beta
        working-directory: iosApp
        timeout-minutes: 45
        run: bundle exec fastlane ios beta
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_IPA: ${{ runner.temp }}/ipa/LMusic-KMP.ipa
          TESTFLIGHT_EXPECTED_BUILD: ${{ github.run_number }}
          TESTFLIGHT_CHANGELOG: "Snapshot ${{ github.run_number }} (${{ github.sha }}). Please test startup, library browsing and playback."
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_OPT_OUT_USAGE: '1'

      # 7. 保留 IPA 作为构建产物
      - name: Upload IPA
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: LMusic-snapshot-ios
          path: ${{ runner.temp }}/ipa/*.ipa

  # ──────────────────────────────────────────────
  # 仅分发重试复用 IPA，不运行平台编译，也不取消正在进行的完整构建。
  retry-testflight-beta:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight_source_run != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight-beta.yml
    with:
      source_run_id: ${{ inputs.testflight_source_run }}
    secrets: inherit

  # 汇总产物 → 发布到 snapshot release
  # ──────────────────────────────────────────────
  publish-snapshot:
    name: Publish Snapshot Release
    needs: [ build-android, build-windows, build-macos, build-linux, build-ios ]
    # 手动勾选 skip_ios 跳过 iOS 时，仍正常发布其他平台产物；iOS 构建失败则跳过发布
    if: ${{ !cancelled() && needs.build-android.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' && needs.build-ios.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: snapshot-artifacts
          pattern: LMusic-snapshot-*
          merge-multiple: true

      - name: Show downloaded artifacts
        run: ls -la snapshot-artifacts/

      - name: Generate commit message
        id: commit
        run: |
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=format:"%s" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete existing snapshot release
        continue-on-error: true
        run: |
          gh release delete ${{ env.SNAPSHOT_TAG }} --yes --repo ${{ env.SNAPSHOT_OWNER }}/${{ env.SNAPSHOT_REPO }}
          git push origin --delete ${{ env.SNAPSHOT_TAG }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          name: "Snapshot Build"
          body: |
            Auto-built from ${{ github.sha }}
            ${{ steps.commit.outputs.msg }}
          prerelease: true
          files: snapshot-artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: false

  # ──────────────────────────────────────────────
  # 部署 Snapshot 发布页到 Vercel
  # ──────────────────────────────────────────────
  deploy-page:
    name: Deploy Snapshot Page
    needs: publish-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./release-page

      - name: Build Next.js
        run: npm run build
        working-directory: ./release-page

      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        working-directory: ./release-page
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SNAPSHOT_PROJECT_ID }}

  # ──────────────────────────────────────────────
  # 通知 QQ 群
  # ──────────────────────────────────────────────
  notify-qq:
    name: Notify QQ Group
    needs: publish-snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build webhook payload and notify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'auto build' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_TS: ${{ github.event.head_commit.timestamp }}
        run: |
          ASSETS=$(gh release view snapshot --repo ${{ github.repository }} --json assets -q '[.assets[] | {key: .name, value: .browser_download_url}] | from_entries' 2>/dev/null || echo "{}")
          export ASSETS

          python3 << 'PYEOF'
          import json, os, ssl, urllib.request, urllib.error
          ctx = ssl._create_unverified_context()

          payload = {
              'version': 'snapshot-' + os.environ.get('SNAPSHOT_SHA', '')[:7],
              'tag': 'snapshot',
              'branch': 'dev',
              'sha': os.environ.get('SNAPSHOT_SHA', ''),
              'changelog': os.environ.get('COMMIT_MSG', ''),
              'published_at': os.environ.get('SNAPSHOT_TS', ''),
              'run_url': os.environ.get('RUN_URL', ''),
              'download_links': json.loads(os.environ.get('ASSETS', '{}'))
          }
          
          data = json.dumps(payload, ensure_ascii=False).encode()
          req = urllib.request.Request(
              '${{ secrets.ASTRBOT_WEBHOOK_URL }}',
              data=data,
              headers={
                  'Authorization': 'Bearer ${{ secrets.ASTRBOT_API_KEY }}',
                  'Content-Type': 'application/json'
              },
              method='POST'
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15, context=ctx)
              print('Webhook response:', resp.read().decode())
          except Exception as e:
              print(f'Webhook failed: {e}')
          PYEOF
