#Kotlin
kotlin.code.style=official
# K/N 链接大 framework（iOS linkReleaseFrameworkIosArm64）需要 >4G 堆；
# 4G 在 CI 上稳定 OOM（Java heap space），提到 6G
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseParallelGC
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.yarn.ignore.scripts=true

#Gradle
# 与 kotlin daemon 平衡：总 JVM 需求约 12G，适配 CI runner（macOS 14G）与本地
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false

org.gradle.caching=true
org.gradle.vfs.watch=true

#KSP
ksp.incremental=true
ksp.incremental.log=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# ERROR: Compose targets '[macos]' are experimental and may have bugs!
org.jetbrains.compose.experimental.macos.enabled=true

# Windows环境无法编译iOS相关代码，需要disable掉iOS源集，注意要在local.properties里配置（默认为false）
# lalilu.disable.ios.targets=true