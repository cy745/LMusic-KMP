#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M -XX:+UseParallelGC
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.yarn.ignore.scripts=true

#Gradle
org.gradle.jvmargs=-Xmx12288M -XX:MaxMetaspaceSize=2048M -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 配置缓存：配置阶段是大头（--dry-run 实测 19s），复用后增量无改动构建 14s -> 2s
org.gradle.configuration-cache=true
# 允许 Gradle 自动下载缺失的 JDK 21 toolchain
org.gradle.java.installations.auto-download=true

org.gradle.caching=true
org.gradle.vfs.watch=true
# 多模块（27 个）并行执行：实测 :androidApp:assembleDebug 冷构建 ~70s -> ~63s
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

#KSP
ksp.incremental=true
ksp.incremental.log=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# ERROR: Compose targets '[macos]' are experimental and may have bugs!
org.jetbrains.compose.experimental.macos.enabled=true

# Windows环境无法编译iOS相关代码，需要disable掉iOS源集，注意要在local.properties里配置（默认为false）
# lalilu.disable.ios.targets=true
