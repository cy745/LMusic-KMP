kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# jb-compose
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version = "1.2.0-alpha04" }

# jb-androidx
jbx-savedstate-compose = { module = "org.jetbrains.androidx.savedstate:savedstate-compose", version = "1.3.1" }
jbx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
jbx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

krouter-core = { module = "io.github.cy745.KRouter:core", version.ref = "krouter" }
