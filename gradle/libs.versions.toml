composeHotReload = "1.0.0-beta03"
composeMultiplatform = "1.8.2"
kotlinx-serialization = "1.9.0"
junit = "4.13.2"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
kotlinx-coroutines = "1.10.2"
tiamat = "2.0.0-alpha01"
krouter = "0.0.4"
vortex = "0.2.5"
filekit = "0.10.0-beta04"
koin = "4.1.0"
